name: Daily internship scout
on:
  schedule:
    - cron: "0 12 * * *"  # 8 AM EDT / 7 AM EST
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Find new matching roles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scout.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-coverage-report
          path: coverage_report.md
          if-no-files-found: warn
      - name: Save previously seen roles
        run: |
          git config user.name "internship-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen internships" && git push)
